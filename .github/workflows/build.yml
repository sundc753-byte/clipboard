name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/ClipboardApp.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish
      - name: Compute artifact name
        id: ver
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "name=ClipboardApp-build${{ github.run_number }}-${sha:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: publish/ClipboardApp.exe
