name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compute version
        id: ver
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "name=ClipboardApp-v1.0.${{ github.run_number }}-${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
      - run: dotnet publish src/ClipboardApp.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=1.0.${{ github.run_number }} -o publish
      - name: Write version file
        shell: bash
        run: echo "ClipboardApp v1.0.${{ github.run_number }} (commit ${{ steps.ver.outputs.sha }})" > publish/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: |
            publish/ClipboardApp.exe
            publish/version.txt
